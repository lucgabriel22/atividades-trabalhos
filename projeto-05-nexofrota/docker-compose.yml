services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DATABASE:-nexofrota}
      POSTGRES_USER: ${POSTGRES_USER:-nexofrota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexofrota_dev}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-nexofrota}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-nexofrota_dev}
    ports:
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "mongosh --quiet --username $${MONGO_INITDB_ROOT_USERNAME} --password $${MONGO_INITDB_ROOT_PASSWORD} --authenticationDatabase admin --eval 'db.adminCommand({ ping: 1 }).ok' | grep 1",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  app:
    build: .
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DATABASE: ${POSTGRES_DATABASE:-nexofrota}
      POSTGRES_USER: ${POSTGRES_USER:-nexofrota}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nexofrota_dev}
      MONGO_URI: mongodb://${MONGO_USER:-nexofrota}:${MONGO_PASSWORD:-nexofrota_dev}@mongo:27017/?authSource=admin
      MONGO_DATABASE: ${MONGO_DATABASE:-nexofrota}
      DEFAULT_MAP_LATITUDE: ${DEFAULT_MAP_LATITUDE:--23.5505}
      DEFAULT_MAP_LONGITUDE: ${DEFAULT_MAP_LONGITUDE:--46.6333}
      DEFAULT_RADIUS_KM: ${DEFAULT_RADIUS_KM:-25}
      SIMULATION_MAX_STEP_KM: ${SIMULATION_MAX_STEP_KM:-2.5}
    ports:
      - "8501:8501"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  mongo_data:
